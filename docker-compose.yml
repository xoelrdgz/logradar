services:
  logradar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
        COMMIT: "${GIT_COMMIT:-unknown}"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
    container_name: logradar
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 512M
        reservations:
          cpus: "2"
          memory: 256M

    security_opt:
      - no-new-privileges:true
    read_only: true

    profiles: ["file"]

    volumes:
      - ./configs:/etc/logradar:ro
      - ./output:/output
      - ${LOGRADAR_LOG_FILE:-./access.log}:/logs/access.log:ro

    environment:
      - LOGRADAR_LOG_PATH=/logs/access.log
      - LOGRADAR_LOG_FORMAT=${LOGRADAR_LOG_FORMAT:-combined}
      - LOGRADAR_THREAT_INTEL_ENABLED=false
      - LOGRADAR_OUTPUT_JSON_PATH=/output/alerts.json
      - LOGRADAR_OUTPUT_JSON_ENABLED=true
      - LOGRADAR_WORKERS_COUNT=16
      - GOMAXPROCS=4

    ports:
      - "9190:9090"

    command: ["analyze", "--config", "/etc/logradar/config.yaml", "--no-tui"]

    healthcheck:
      test: ["CMD", "/logradar", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  logradar-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logradar-demo
    profiles: ["demo"]

    deploy:
      resources:
        limits:
          cpus: "12"
          memory: 2G

    environment:
      - GOMAXPROCS=12

    ports:
      - "9091:9090"

    command:
      [
        "analyze",
        "--demo",
        "--demo-rate",
        "185000",
        "--workers",
        "12",
        "--no-tui",
      ]
  logradar-tui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logradar-tui
    profiles: ["tui"]

    stdin_open: true
    tty: true

    deploy:
      resources:
        limits:
          cpus: "12"
          memory: 2G

    volumes:
      - ./configs:/etc/logradar:ro
      - ./output:/output

    environment:
      - GOMAXPROCS=12
      - TERM=xterm-256color

    command: ["analyze", "--demo", "--demo-rate", "100000", "--workers", "16"]

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: logradar-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

    ports:
      - "9093:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

volumes:
  prometheus_data:
