name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Test with race detector
        run: go test -race ./...

      - name: Short fuzz smoke tests
        run: |
          go test -run=^$ -fuzz=Fuzz -fuzztime=10s ./internal/adapters/input
          go test -run=^$ -fuzz=Fuzz -fuzztime=10s ./internal/adapters/detection

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Generate SBOM
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest mod -output sbom.json -json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: logradar-sbom
          path: sbom.json

  container:
    name: Container and Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose profiles
        run: |
          docker compose --profile file config
          docker compose --profile demo --profile monitoring config

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t logradar:ci .

      - name: Smoke test Docker image
        run: |
          docker run --rm -d --name logradar-smoke -p 19090:9090 logradar:ci analyze --demo --demo-rate 10 --no-tui
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:19090/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:19090/live
          docker stop logradar-smoke
